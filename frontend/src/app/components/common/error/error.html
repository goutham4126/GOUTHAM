<div class="error-container bg-bg-base min-h-screen flex items-center justify-center transition-colors">
  <div class="error-content bg-surface shadow-sm rounded-2xl p-8 max-w-lg w-full text-center border border-border">
    <div class="icon-container mb-6 text-accent-red">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-24 w-24 mx-auto" fill="none" viewBox="0 0 24 24"
        stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
    </div>

    <h1 class="text-6xl font-bold text-text-primary mb-4 animate-bounce">
      {{ errorCode }}
    </h1>

    <h2 class="text-3xl font-bold text-text-primary mb-6">
      Oops! Something went wrong.
    </h2>

    <div class="bg-accent-red/10 border border-accent-red/20 rounded-xl p-4 mb-8">
      <p class="text-accent-red text-lg">
        {{ errorMessage }}
      </p>
    </div>

    <button (click)="goHome()"
      class="inline-flex items-center justify-center px-6 py-3 border border-transparent text-base font-semibold rounded-xl text-white bg-primary hover:bg-primary-light focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all shadow-[0_4px_14px_rgba(124,58,237,0.3)]">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
        <path
          d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z" />
      </svg>
      Return to Home
    </button>
  </div>
</div>
