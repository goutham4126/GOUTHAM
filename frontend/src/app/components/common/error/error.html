<div class="error-container dark:bg-gray-900">
  <div class="error-content bg-white dark:bg-gray-800 shadow-xl rounded-lg p-8 max-w-lg w-full text-center">
    <div class="icon-container mb-6 text-red-500">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-24 w-24 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
    </div>
    
    <h1 class="text-6xl font-extrabold text-gray-900 dark:text-white mb-4 animate-bounce">
      {{ errorCode }}
    </h1>
    
    <h2 class="text-3xl font-bold text-gray-800 dark:text-gray-100 mb-6">
      Oops! Something went wrong.
    </h2>
    
    <div class="bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800 rounded-md p-4 mb-8">
      <p class="text-red-700 dark:text-red-300 text-lg">
        {{ errorMessage }}
      </p>
    </div>
    
    <button 
      (click)="goHome()" 
      class="inline-flex items-center justify-center px-6 py-3 border border-transparent text-base font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 dark:bg-indigo-500 dark:hover:bg-indigo-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150 ease-in-out">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
        <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z" />
      </svg>
      Return to Home
    </button>
  </div>
</div>
