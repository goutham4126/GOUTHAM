<div class="space-y-8">
    <!-- Create Plan Form Section -->
    <div
        class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition-shadow duration-200">
        <div class="px-6 py-4 border-b border-gray-100 bg-gray-50/80 flex items-center gap-2 backdrop-blur-sm">
            <svg class="w-4 h-4 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
            </svg>
            <h3 class="text-xs font-bold text-gray-600 uppercase tracking-widest">Create New Insurance Plan</h3>
        </div>
        <div class="p-6">
            <form (ngSubmit)="createPlan()" [formGroup]="planForm" class="grid grid-cols-1 md:grid-cols-2 gap-6">

                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wide mb-1.5">Plan
                        Name</label>
                    <input type="text" formControlName="name" placeholder="e.g., Premium Auto Cover"
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wide mb-1.5">Payment
                        Frequency</label>
                    <select formControlName="paymentFrequency"
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition bg-white">
                        <option value="Monthly">Monthly</option>
                        <option value="Yearly">Yearly</option>
                    </select>
                </div>

                <div class="md:col-span-2">
                    <label
                        class="block text-xs font-semibold text-gray-600 uppercase tracking-wide mb-1.5">Description</label>
                    <input type="text" formControlName="description" placeholder="Short description of benefits"
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wide mb-1.5">Premium
                        Amount (₹)</label>
                    <input type="number" formControlName="premiumAmount" placeholder="0.00"
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wide mb-1.5">Coverage
                        Amount (₹)</label>
                    <input type="number" formControlName="coverageAmount" placeholder="0.00"
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wide mb-1.5">Duration
                        (Months)</label>
                    <input type="number" formControlName="durationInMonths" placeholder="12"
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                </div>

                <div class="md:col-span-2 flex justify-end mt-4">
                    <button type="submit" [disabled]="!planForm.valid"
                        class="px-6 py-2.5 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 active:bg-blue-800 transition disabled:opacity-50 disabled:cursor-not-allowed shadow-sm text-sm tracking-wide">
                        Publish Insurance Plan
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Configured Plans Section -->
    <div
        class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition-shadow duration-200">
        <div
            class="px-6 py-4 border-b border-gray-100 bg-gray-50/80 flex justify-between items-center backdrop-blur-sm">
            <h3 class="text-xs font-bold text-gray-600 uppercase tracking-widest flex items-center gap-2">
                <svg class="w-4 h-4 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                </svg>
                Insurance Plans
            </h3>
        </div>

        <div class="p-0 overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50 border-b border-gray-100">
                    <tr>
                        <th scope="col"
                            class="px-6 py-3.5 text-left text-[11px] font-bold text-gray-500 uppercase tracking-widest bg-gray-50/50">
                            Plan Name</th>
                        <th scope="col"
                            class="px-6 py-3.5 text-left text-[11px] font-bold text-gray-500 uppercase tracking-widest bg-gray-50/50">
                            Premium</th>
                        <th scope="col"
                            class="px-6 py-3.5 text-right text-[11px] font-bold text-gray-500 uppercase tracking-widest bg-gray-50/50">
                            Coverage</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-100">
                    <tr *ngIf="loadingPlans">
                        <td colspan="3" class="px-6 py-4 text-center text-sm text-gray-500">Loading plans...</td>
                    </tr>
                    <tr *ngFor="let p of plans" class="hover:bg-blue-50/30 transition-colors duration-150 group">
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="text-sm font-medium text-gray-900">{{ p.name }}</div>
                            <div class="text-xs text-gray-400 max-w-xs truncate">{{ p.description }}</div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                            ₹{{ p.premiumAmount }}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium text-gray-900">
                            ₹{{ p.coverageAmount }}
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
