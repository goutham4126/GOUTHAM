<div class="fixed top-20 right-4 z-[9999] flex flex-col gap-3 pointer-events-none">
  @for (toast of toastService.toasts(); track toast) {
    <div
      class="flex items-center w-full max-w-sm p-4 bg-surface rounded-xl shadow-xl border border-border border-l-4 pointer-events-auto transform transition-all duration-300 ease-in-out"
      [ngClass]="{
        'border-l-accent-green': toast.type === 'success',
        'border-l-accent-red': toast.type === 'error',
        'border-l-yellow-400': toast.type === 'warning',
        'border-l-accent-blue': toast.type === 'info'
      }">
      <div class="inline-flex items-center justify-center flex-shrink-0 w-8 h-8 rounded-lg"
        [ngClass]="{
          'bg-accent-green/10 text-accent-green': toast.type === 'success',
          'bg-accent-red/10 text-accent-red': toast.type === 'error',
          'bg-yellow-400/10 text-yellow-500': toast.type === 'warning',
          'bg-accent-blue/10 text-accent-blue': toast.type === 'info'
        }">
        <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
          stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="getIcon(toast.type)" />
        </svg>
      </div>
      <div class="ms-3 text-sm font-semibold text-text-primary tracking-wide flex-grow pr-3 break-words">{{ toast.message }}</div>
      <button type="button" (click)="toastService.remove(toast.id)"
        class="ms-auto -mx-1.5 -my-1.5 bg-transparent text-text-muted hover:text-text-primary rounded-lg p-1.5 hover:bg-bg-base inline-flex items-center justify-center h-8 w-8 transition-colors">
        <span class="sr-only">Close</span>
        <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6" />
        </svg>
      </button>
    </div>
  }
</div>

<!-- Confirm Dialog Modal -->
@if (toastService.confirmDialog()) {
  <div class="fixed inset-0 z-[10000] flex items-center justify-center bg-bg-base/60 backdrop-blur-sm p-4">
    <div class="bg-surface rounded-2xl shadow-2xl max-w-sm w-full overflow-hidden transform transition-all border border-border">
      <div class="p-6 text-center">
        <svg class="mx-auto mb-4 text-yellow-500 w-12 h-12" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
          fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
        <h3 class="mb-3 text-lg font-bold text-text-primary tracking-wide">{{ toastService.confirmDialog()?.title }}</h3>
        <p class="mb-6 text-sm text-text-muted font-medium">{{ toastService.confirmDialog()?.message }}</p>
        <div class="flex justify-center gap-3">
          <button (click)="toastService.rejectConfirm()" type="button"
            class="text-text-primary bg-surface hover:bg-bg-base border border-border rounded-xl text-sm font-bold px-5 py-2 transition-colors shadow-sm">
            Cancel
          </button>
          <button (click)="toastService.resolveConfirm()" type="button"
            class="text-white bg-primary hover:bg-primary-light font-bold rounded-xl text-sm px-5 py-2 transition-colors shadow-sm">
            Confirm
          </button>
        </div>
      </div>
    </div>
  </div>
}
