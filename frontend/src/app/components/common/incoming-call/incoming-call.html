@if (videoCallService.callState() === 'ringing' && videoCallService.incomingCall()) {
<div class="incoming-call-backdrop">
    <div class="incoming-call-card">

        <!-- Animated background rings -->
        <div class="bg-rings">
            <div class="bg-ring ring-1"></div>
            <div class="bg-ring ring-2"></div>
            <div class="bg-ring ring-3"></div>
        </div>

        <!-- Content -->
        <div class="card-content">
            <!-- Caller avatar with pulse -->
            <div class="caller-section">
                <div class="incoming-pulse-wrapper">
                    <div class="incoming-pulse"></div>
                    <div class="incoming-pulse incoming-pulse-delay-1"></div>
                    <div class="incoming-pulse incoming-pulse-delay-2"></div>
                    <div class="caller-icon">
                        <svg class="w-12 h-12 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Call info -->
            <div class="call-info">
                <p class="call-label">Incoming Video Call</p>
                <h2 class="caller-name">{{ videoCallService.incomingCall()?.callerName }}</h2>
                <div class="claim-tag">
                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                    Claim Verification
                </div>
                <p class="call-subtitle">Claims officer wants to video verify your claim</p>
            </div>

            <!-- Action buttons -->
            <div class="action-buttons">
                <button (click)="decline()" class="decline-btn">
                    <div class="btn-icon-wrapper decline-icon-bg">
                        <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M16 8l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M5 3a2 2 0 00-2 2v1c0 8.284 6.716 15 15 15h1a2 2 0 002-2v-3.28a1 1 0 00-.684-.948l-4.493-1.498a1 1 0 00-1.21.502l-1.13 2.257a11.042 11.042 0 01-5.516-5.517l2.257-1.128a1 1 0 00.502-1.21L9.228 3.683A1 1 0 008.279 3H5z" />
                        </svg>
                    </div>
                    <span class="btn-label">Decline</span>
                </button>

                <button (click)="accept()" class="accept-btn">
                    <div class="btn-icon-wrapper accept-icon-bg">
                        <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                        </svg>
                    </div>
                    <span class="btn-label">Accept</span>
                </button>
            </div>
        </div>
    </div>
</div>
}
