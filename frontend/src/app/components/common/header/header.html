<header class="bg-white shadow-sm border-b border-gray-100 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16 items-center">
            <div class="flex-shrink-0 flex items-center cursor-pointer" routerLink="/">
                <img src="/logo.png" alt="CDIMS Logo" class="h-8 w-auto mr-2" />
            </div>

            <div class="flex items-center space-x-4">
                <ng-container *ngIf="!authService.isAuthenticated()">
                    <a routerLink="/login"
                        class="text-gray-500 hover:text-gray-700 px-3 py-2 rounded-lg text-sm font-semibold transition">Log
                        in</a>
                    <a routerLink="/register"
                        class="bg-blue-600 text-white hover:bg-blue-700 px-4 py-2 rounded-lg text-sm font-semibold shadow-sm transition tracking-wide">Sign
                        Up</a>
                </ng-container>

                <ng-container *ngIf="authService.isAuthenticated()">
                    <div class="flex items-center space-x-3">
                        <span class="text-sm text-gray-500 hidden sm:block"><span
                                class="font-bold text-gray-800">{{ authService.currentUser()?.fullName }}</span></span>
                        <!-- Role Badge matches profile colors -->
                        <span *ngIf="authService.getRole() === 'Customer'"
                            class="px-2.5 py-0.5 bg-blue-100 text-blue-700 text-xs font-bold rounded-full border border-blue-200 tracking-wide uppercase">{{
                            authService.getRole() }}</span>
                        <span *ngIf="authService.getRole() === 'Admin'"
                            class="px-2.5 py-0.5 bg-violet-100 text-violet-700 text-xs font-bold rounded-full border border-violet-200 tracking-wide uppercase">{{
                            authService.getRole() }}</span>
                        <span *ngIf="authService.getRole() === 'Agent'"
                            class="px-2.5 py-0.5 bg-teal-100 text-teal-700 text-xs font-bold rounded-full border border-teal-200 tracking-wide uppercase">{{
                            authService.getRole() }}</span>
                        <span *ngIf="authService.getRole() === 'ClaimOfficer'"
                            class="px-2.5 py-0.5 bg-orange-100 text-orange-700 text-xs font-bold rounded-full border border-orange-200 tracking-wide uppercase">{{
                            authService.getRole() }}</span>
                        <button (click)="logout()"
                            class="ml-3 text-sm font-semibold text-red-500 hover:text-red-700 transition">Logout</button>
                    </div>
                </ng-container>
            </div>
        </div>
    </div>
</header>
