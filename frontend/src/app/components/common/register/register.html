<div class="min-h-screen flex items-center justify-center bg-linear-to-br from-slate-100 to-slate-200 px-4 py-10">

  <div class="w-full max-w-3xl bg-white shadow-2xl rounded-3xl p-10">

    <!-- Header -->
    <div class="text-center mb-10">
      <h2 class="text-4xl font-bold text-slate-800">Create Account</h2>
      <p class="text-slate-500 mt-2">Join Insurance Management System</p>
    </div>

    <form (ngSubmit)="onRegister()" class="space-y-6">

      <!-- Name -->
      <div class="grid md:grid-cols-2 gap-5">
        <input
          type="text"
          name="firstName"
          [ngModel]="firstName()"
          (ngModelChange)="firstName.set($event)"
          placeholder="First Name"
          required
          class="input-style"
        />

        <input
          type="text"
          name="lastName"
          [ngModel]="lastName()"
          (ngModelChange)="lastName.set($event)"
          placeholder="Last Name"
          required
          class="input-style"
        />
      </div>

      <!-- Email -->
      <input
        type="email"
        name="email"
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
        placeholder="Email Address"
        required
        class="input-style"
      />

      <!-- Password -->
      <input
        type="password"
        name="password"
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
        placeholder="Password"
        required
        class="input-style"
      />

      <!-- Government ID + Phone -->
      <div class="grid md:grid-cols-2 gap-5">
        <input
          type="text"
          name="governmentId"
          [ngModel]="governmentId()"
          (ngModelChange)="governmentId.set($event)"
          placeholder="Government ID"
          required
          class="input-style"
        />

        <input
          type="tel"
          name="phone"
          [ngModel]="phone()"
          (ngModelChange)="phone.set($event)"
          placeholder="Phone Number"
          required
          class="input-style"
        />
      </div>

      <!-- Address -->
      <textarea
        name="address"
        [ngModel]="address()"
        (ngModelChange)="address.set($event)"
        placeholder="Address"
        required
        rows="3"
        class="input-style resize-none"
      ></textarea>

      <!-- Date of Birth -->
      <input
        type="date"
        name="dateOfBirth"
        [ngModel]="dateOfBirth()"
        (ngModelChange)="dateOfBirth.set($event)"
        required
        class="input-style"
      />

      <!-- CAPTCHA Section -->
      <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">

        <div class="flex items-center justify-between">
          <span class="font-mono text-xl tracking-widest text-blue-600 font-semibold">
            {{ generatedCaptcha() }}
          </span>

          <button
            type="button"
            (click)="generateCaptcha()"
            class="text-sm text-blue-500 hover:underline"
          >
            Refresh
          </button>
        </div>

        <input
          type="text"
          name="captcha"
          [ngModel]="enteredCaptcha()"
          (ngModelChange)="enteredCaptcha.set($event)"
          placeholder="Enter CAPTCHA"
          required
          class="input-style"
        />

        <p *ngIf="captchaError()" class="text-red-500 text-sm">
          {{ captchaError() }}
        </p>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 active:scale-95 transition transform text-white py-3 rounded-xl font-semibold shadow-lg"
      >
        Create Account
      </button>

      <!-- Login Redirect -->
      <p class="text-center text-slate-500 text-sm mt-4">
        Already have an account?
        <a routerLink="/login" class="text-blue-600 font-medium hover:underline">
          Login here
        </a>
      </p>

    </form>
  </div>
</div>
