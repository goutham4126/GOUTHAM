<div class="fixed top-20 right-4 z-[9999] flex flex-col gap-3 pointer-events-none">
    <div *ngFor="let toast of toastService.toasts()"
        class="flex items-center w-full max-w-sm p-4 text-gray-600 bg-white rounded-xl shadow-xl border-l-4 pointer-events-auto transform transition-all duration-300 ease-in-out"
        [ngClass]="{
         'border-green-500 text-green-900': toast.type === 'success',
         'border-red-500 text-red-900': toast.type === 'error',
         'border-yellow-500 text-yellow-900': toast.type === 'warning',
         'border-blue-500 text-blue-900': toast.type === 'info'
       }">
        <div class="inline-flex items-center justify-center flex-shrink-0 w-8 h-8 rounded-lg" [ngClass]="{
           'bg-green-100 text-green-500': toast.type === 'success',
           'bg-red-100 text-red-500': toast.type === 'error',
           'bg-yellow-100 text-yellow-500': toast.type === 'warning',
           'bg-blue-100 text-blue-500': toast.type === 'info'
         }">
            <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="getIcon(toast.type)" />
            </svg>
        </div>
        <div class="ms-3 text-sm font-semibold tracking-wide flex-grow pr-3 break-words">{{ toast.message }}</div>
        <button type="button" (click)="toastService.remove(toast.id)"
            class="ms-auto -mx-1.5 -my-1.5 bg-white text-gray-400 hover:text-gray-900 rounded-lg focus:ring-2 focus:ring-gray-300 p-1.5 hover:bg-gray-100 inline-flex items-center justify-center h-8 w-8">
            <span class="sr-only">Close</span>
            <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6" />
            </svg>
        </button>
    </div>
</div>

<!-- Confirm Dialog Modal -->
<div *ngIf="toastService.confirmDialog()"
    class="fixed inset-0 z-[10000] flex items-center justify-center bg-gray-900/60 backdrop-blur-sm p-4">
    <div
        class="bg-white rounded-2xl shadow-2xl max-w-sm w-full overflow-hidden transform transition-all translate-y-0 opacity-100">
        <div class="p-6 text-center">
            <svg class="mx-auto mb-4 text-orange-500 w-12 h-12" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
            <h3 class="mb-3 text-lg font-bold text-gray-800 tracking-wide">{{ toastService.confirmDialog()?.title }}
            </h3>
            <p class="mb-6 text-sm text-gray-500 font-medium">{{ toastService.confirmDialog()?.message }}</p>
            <div class="flex justify-center gap-3">
                <button (click)="toastService.rejectConfirm()" type="button"
                    class="text-gray-600 bg-white hover:bg-gray-100 focus:ring-4 focus:outline-none focus:ring-gray-200 rounded-xl border border-gray-200 text-sm font-bold px-5 py-2 hover:text-gray-900 focus:z-10 transition-colors shadow-sm">
                    Cancel
                </button>
                <button (click)="toastService.resolveConfirm()" type="button"
                    class="text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300 font-bold rounded-xl text-sm inline-flex items-center px-5 py-2 text-center transition-colors shadow-sm">
                    Confirm
                </button>
            </div>
        </div>
    </div>
</div>
