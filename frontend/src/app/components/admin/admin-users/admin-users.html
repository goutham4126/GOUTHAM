<div
  class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition-shadow duration-200">
  <div class="px-6 py-4 border-b border-gray-100 bg-gray-50/80 flex justify-between items-center backdrop-blur-sm">
    <h3 class="text-xs font-bold text-gray-600 uppercase tracking-widest flex items-center gap-2">
      <svg class="w-4 h-4 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
      </svg>
      User Directory Overview
    </h3>
    <span
      class="bg-blue-50 border border-blue-200 text-blue-700 text-xs font-bold px-2.5 py-1 rounded-full tracking-wide">{{
      users.length }}
      Users</span>
  </div>

  <!-- Chart Section -->
  <div class="p-6 border-b border-gray-100 bg-white">
    <div class="h-64 mb-4">
      <canvas baseChart [data]="barChartData" [options]="barChartOptions" [plugins]="barChartPlugins"
        [legend]="barChartLegend" type="bar">
      </canvas>
    </div>
  </div>

  <div class="p-0 overflow-x-auto">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50 border-b border-gray-100">
        <tr>
          <th scope="col"
            class="px-6 py-3.5 text-left text-[11px] font-bold text-gray-500 uppercase tracking-widest bg-gray-50/50">
            Name</th>
          <th scope="col"
            class="px-6 py-3.5 text-left text-[11px] font-bold text-gray-500 uppercase tracking-widest bg-gray-50/50">
            Role</th>
          <th scope="col"
            class="px-6 py-3.5 text-right text-[11px] font-bold text-gray-500 uppercase tracking-widest bg-gray-50/50">
            Action
          </th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-100">
        @if (loadingUsers) {
        <tr>
          <td colspan="3" class="px-6 py-4 text-center text-sm text-gray-500">Loading users...</td>
        </tr>
        }
        @for (u of users; track u) {
        <tr class="hover:bg-blue-50/30 transition-colors duration-150 group">
          <td class="px-6 py-4 whitespace-nowrap">
            <div class="text-sm font-medium text-gray-900">{{ u.firstName }} {{ u.lastName }}</div>
            <div class="text-sm text-gray-500">{{ u.email }}</div>
          </td>
          <td class="px-6 py-4 whitespace-nowrap">
            <select [ngModel]="u.role" (ngModelChange)="updateRole(u.id, $event)"
              class="border border-gray-300 text-black rounded-lg text-sm px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition shadow-sm bg-white">
              <option value="Customer">Customer</option>
              <option value="Agent">Agent</option>
              <option value="ClaimOfficer">Claims Officer</option>
              <option value="Admin">Admin</option>
            </select>
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
            <div class="flex items-center justify-end gap-3">
              <span class="text-gray-400 italic text-xs">Auto-saves</span>
              <button (click)="deleteUser(u.id, u.firstName + ' ' + u.lastName)"
                class="text-red-600 hover:text-red-800 bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-md transition-colors text-xs font-bold border border-red-200 shadow-sm">
                Delete
              </button>
            </div>
          </td>
        </tr>
        }
      </tbody>
    </table>
  </div>
</div>
