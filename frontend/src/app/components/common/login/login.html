<div class="flex items-center justify-center min-h-[80vh]">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
    <h2 class="text-3xl font-bold text-center text-gray-800 mb-2">Welcome Back</h2>
    <p class="text-center text-sm text-gray-500 mb-6">Sign in to your account</p>

    @if (error) {
    <div class="mb-4 p-3 bg-red-100 text-red-700 rounded-lg text-sm text-center">
      {{ error }}
    </div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
      <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wide mb-1.5">Email</label>
        <input type="email" formControlName="email"
          class="w-full px-4 text-black py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
          placeholder="jane@example.com">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wide mb-1.5">Password</label>
        <input type="password" formControlName="password"
          class="w-full px-4 text-black py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
          placeholder="••••••••">
      </div>

      <button type="submit" [disabled]="loginForm.invalid || loading"
        class="w-full bg-blue-600 text-white font-semibold py-2.5 rounded-lg hover:bg-blue-700 active:bg-blue-800 transition disabled:opacity-50 disabled:cursor-not-allowed shadow-sm tracking-wide">
        {{ loading ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-gray-600">
      Don't have an account? <a routerLink="/register" class="text-blue-600 font-semibold hover:underline">Register
        here</a>
    </p>
  </div>
</div>
