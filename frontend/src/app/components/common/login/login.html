<div class="min-h-screen flex items-center justify-center bg-linear-to-br from-slate-100 to-slate-200 px-4 py-10">

  <div class="w-full max-w-xl bg-white shadow-2xl rounded-3xl p-10">

    <!-- Header -->
    <div class="text-center mb-10">
      <h2 class="text-4xl font-bold text-slate-800">Welcome Back</h2>
      <p class="text-slate-500 mt-2">Login to Insurance Management System</p>
    </div>

    <form (ngSubmit)="login()" class="space-y-6">

      <!-- Username -->
      <input
        type="email"
        name="Email"
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
        placeholder="Email"
        required
        class="input-style"
      />

      <!-- Password -->
      <input
        type="password"
        name="password"
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
        placeholder="Password"
        required
        class="input-style"
      />

      <!-- CAPTCHA Section -->
      <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">

        <div class="flex items-center justify-between">
          <span class="font-mono text-xl tracking-widest text-blue-600 font-semibold">
            {{ generatedCaptcha() }}
          </span>

          <button
            type="button"
            (click)="generateCaptcha()"
            class="text-sm text-blue-500 hover:underline"
          >
            Refresh
          </button>
        </div>

        <input
          type="text"
          name="captcha"
          [ngModel]="enteredCaptcha()"
          (ngModelChange)="enteredCaptcha.set($event)"
          placeholder="Enter CAPTCHA"
          required
          class="input-style"
        />

        <p *ngIf="captchaError()" class="text-red-500 text-sm">
          {{ captchaError() }}
        </p>
      </div>

      <!-- Login Button -->
      <button
        type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 active:scale-95 transition transform text-white py-3 rounded-xl font-semibold shadow-lg"
      >
        Login
      </button>

      <!-- Register Redirect -->
      <p class="text-center text-slate-500 text-sm mt-4">
        Don't have an account?
        <a routerLink="/register" class="text-blue-600 font-medium hover:underline">
          Create one
        </a>
      </p>

    </form>
  </div>
</div>
