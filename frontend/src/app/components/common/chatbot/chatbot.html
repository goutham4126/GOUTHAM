<div *ngIf="isCustomer()" class="fixed bottom-6 right-6 z-50 flex flex-col items-end">
  <!-- Chat Window -->
  <div *ngIf="isOpen()" @fadeInOut 
       class="mb-4 w-[350px] h-[400px] bg-white rounded-2xl shadow-2xl border border-slate-200 flex flex-col overflow-hidden">
    
    <!-- Header -->
    <div class="bg-blue-600 px-4 py-3 flex items-center justify-between shadow-sm">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center">
          <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
          </svg>
        </div>
        <div>
          <h3 class="text-white font-bold text-sm leading-none">Insure Chatbot</h3>
          <span class="text-blue-100 text-[10px]">Online • Powered by Vertex AI & Gemini</span>
        </div>
      </div>
      <button (click)="toggleChat()" class="text-white hover:bg-white/10 p-1 rounded-lg transition-colors">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Message Area -->
    <div #scrollContainer class="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50/50">
      <div *ngFor="let msg of messages()" 
           [ngClass]="{'items-end': msg.isUser, 'items-start': !msg.isUser}" 
           class="flex flex-col">
        <div [ngClass]="msg.isUser ? 'bg-blue-600 text-white rounded-t-xl rounded-bl-xl shadow-md' : 'bg-white border border-slate-200 text-slate-700 rounded-t-xl rounded-br-xl shadow-sm'"
             class="px-4 py-2.5 max-w-[90%] text-sm leading-relaxed prose prose-sm prose-slate">
          <markdown *ngIf="!msg.isUser" [data]="msg.text"></markdown>
          <span *ngIf="msg.isUser">{{ msg.text }}</span>
        </div>
        <span class="text-[9px] text-slate-400 mt-1 uppercase font-semibold mx-1">
          {{ msg.timestamp | date:'shortTime' }}
        </span>
      </div>

      <!-- Plan Picker -->
      <div *ngIf="showPlanPicker()" class="fade-in space-y-2 animate-in slide-in-from-bottom-2 duration-300">
        <p class="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-2">Available Plans:</p>
        <div class="grid grid-cols-1 gap-2">
          <button *ngFor="let plan of activePlans()" 
                  (click)="selectPlan(plan)"
                  class="text-left px-3 py-2 bg-white border border-blue-200 hover:border-blue-500 hover:bg-blue-50 text-blue-700 rounded-xl text-xs font-semibold transition-all shadow-sm group flex items-center justify-between">
            {{ plan.name }}
            <svg class="w-4 h-4 opacity-0 group-hover:opacity-100 transition-opacity" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Typing Indicator -->
      <div *ngIf="isLoading()" class="flex items-center gap-2 text-slate-400 px-2 animate-pulse">
        <div class="flex gap-1">
          <div class="w-1.5 h-1.5 bg-slate-400 rounded-full"></div>
          <div class="w-1.5 h-1.5 bg-slate-400 rounded-full"></div>
          <div class="w-1.5 h-1.5 bg-slate-400 rounded-full"></div>
        </div>
        <span class="text-[10px] font-medium italic">Gemini is thinking...</span>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="px-4 py-2 bg-slate-50 border-t border-slate-200 flex flex-wrap gap-2">
      <button (click)="askAboutPlan()" 
              class="px-3 py-1 bg-white border border-slate-200 rounded-full text-[10px] font-bold text-slate-600 hover:border-blue-400 hover:text-blue-600 transition-all shadow-sm flex items-center gap-1">
        <svg class="w-3 h-3 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
        </svg>
        Plan Benefits
      </button>
      <button (click)="sendMessage('How do I file a claim?')" 
              class="px-3 py-1 bg-white border border-slate-200 rounded-full text-[10px] font-bold text-slate-600 hover:border-blue-400 hover:text-blue-600 transition-all shadow-sm">
        File a Claim
      </button>
    </div>

    <!-- Input Bar -->
    <div class="p-4 bg-white border-t border-slate-200 flex items-center gap-2">
      <input type="text" 
             [(ngModel)]="userInput" 
             (keydown.enter)="sendMessage()"
             placeholder="Type your message..." 
             class="flex-1 bg-slate-100 border-none rounded-xl px-4 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none placeholder:text-slate-400">
      <button (click)="sendMessage()" 
              class="bg-blue-600 text-white p-2 rounded-xl hover:bg-blue-700 transition-colors shadow-lg shadow-blue-200 active:scale-95 disabled:opacity-50"
              [disabled]="!userInput().trim() || isLoading()">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Bubble Button -->
  <button (click)="toggleChat()" 
          class="group w-14 h-14 bg-blue-600 rounded-full shadow-2xl flex items-center justify-center text-white transition-all hover:scale-110 active:scale-90 relative overflow-hidden">
    <div class="absolute inset-0 bg-white/20 scale-0 group-hover:scale-100 rounded-full transition-transform duration-500"></div>
    <svg *ngIf="!isOpen()" class="w-7 h-7 relative z-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
    </svg>
    <svg *ngIf="isOpen()" class="w-7 h-7 relative z-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
    </svg>
    
    <!-- Notification Dot -->
    <span *ngIf="!isOpen()" class="absolute -top-1 -right-1 flex h-4 w-4">
      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
      <span class="relative inline-flex rounded-full h-4 w-4 bg-blue-500 border-2 border-white"></span>
    </span>
  </button>
</div>
