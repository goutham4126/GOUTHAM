<div class="min-h-screen flex items-center justify-center bg-slate-700 px-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-8">

    <div class="text-center mb-8">
      <h2 class="text-3xl font-bold text-slate-800">Welcome Back</h2>
      <p class="text-slate-500 mt-2">Login to continue</p>
    </div>

    <form (ngSubmit)="onLogin()" class="space-y-5">

      <div>
        <label class="block text-sm font-medium text-slate-600 mb-1">
          Email
        </label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          required
          class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
          placeholder="example@email.com"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-600 mb-1">
          Password
        </label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          required
          class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
          placeholder="Enter password"
        />
      </div>

      <!-- Error -->
      <p *ngIf="auth.error()" class="text-red-500 text-sm">
        {{ auth.error() }}
      </p>

      <button
        type="submit"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-lg font-semibold transition duration-200"
        [disabled]="auth.loading()"
      >
        <span *ngIf="!auth.loading()">Login</span>
        <span *ngIf="auth.loading()">Signing in...</span>
      </button>

    </form>

  </div>
</div>
